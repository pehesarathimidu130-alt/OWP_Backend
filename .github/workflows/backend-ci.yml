name: Oleena Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Verify Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Backend
      run: dotnet build --no-restore --configuration Release

    - name: Run Smoke / Unit Tests
      run: |
        if ls *Test*/*.csproj 1> /dev/null 2>&1 || ls *Tests*/*.csproj 1> /dev/null 2>&1; then
          dotnet test --no-build --configuration Release --verbosity normal
        else
          echo "No standalone test project found; build verification passed."
        fi
